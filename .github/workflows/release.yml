# Checks every push to main, and releases whatever the commits since the last release call for.
#
# Every push: analyze and test, then .github/scripts/next_release.py reads the commit messages
# since the last v* tag (Conventional Commits): a feat makes a minor release, a fix or perf a
# patch one, a "!" or a BREAKING CHANGE line a major one; anything else (docs, chore, ci, ...)
# releases nothing. The build number is the last release's plus one. When there's a release:
#   1. build the signed Android bundle (.aab, for Google Play) and APK (to install directly), and the
#      signed iOS app (.ipa), side by side, with that version and build number;
#   2. once both have built, commit the version (pubspec.yaml) and the notes made from the commits
#      (docs/release-notes/<version>.md) as "chore(release): <version>" on the released commit, tag
#      it, merge it into main, and publish a GitHub release with the three files attached;
#   3. upload the iOS build to TestFlight, and the Android bundle to Google Play's closed testing
#      track (alpha) with the notes' "What's new" text. promote.yml moves it on to open testing
#      (beta) a week later, and to production a week after that.
#
# Run it by hand from the Actions tab with "dry run" ticked to build and sign everything without
# releasing: the files are kept on the run's page for a week.
#
# Secrets (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64      the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS            the key's alias
#   ANDROID_KEY_PASSWORD         the key's password
#   IOS_DIST_CERT_P12_BASE64     the Apple Distribution certificate and key (.p12), base64-encoded
#   IOS_DIST_CERT_PASSWORD       the .p12's password
#   IOS_PROVISIONING_PROFILE_BASE64  the "Chameleon App Store" profile (.mobileprovision), base64-encoded
#   APP_STORE_CONNECT_KEY_ID     the App Store Connect API key's ID
#   APP_STORE_CONNECT_ISSUER_ID  its issuer ID
#   APP_STORE_CONNECT_KEY_P8     the key itself (the .p8 file's contents)
#   PLAY_SERVICE_ACCOUNT_JSON    the Google Play service account's key (the .json file's contents);
#                                without it the Play upload is skipped, with a warning

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign, but don't tag, release or upload to TestFlight
        type: boolean
        default: true

# One run at a time, so two quick pushes can't both release the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the tags, to tell whether this version was released already

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # (A dry run builds the next version even with nothing to release.)
      - name: What's the next release?
        id: version
        run: |
          mkdir -p notes
          python3 .github/scripts/next_release.py $([ "$DRY_RUN" = true ] && echo --dry-run) \
            --notes notes/release-notes.md >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.release == 'true'
        with:
          name: notes
          path: notes/
          retention-days: 7

  android:
    name: Android build
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Without android/key.properties the build would quietly sign with the debug key, which
      # Google Play rejects; so stop here if a secret is missing.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ANDROID_$name secret isn't set (Settings › Secrets and variables › Actions)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build appbundle --release --build-name=${{ needs.check.outputs.version }} --build-number=${{ needs.check.outputs.build }}
      - run: flutter build apk --release --build-name=${{ needs.check.outputs.version }} --build-number=${{ needs.check.outputs.build }}

      - name: Make sure they're signed with the upload key
        run: |
          for file in build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk; do
            if keytool -printcert -jarfile "$file" | grep -q "CN=Android Debug"; then
              echo "::error::$file is signed with the debug key, not the upload key."
              exit 1
            fi
          done

      - name: Name the files
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/chameleon-$VERSION.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/chameleon-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          retention-days: 7

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

  ios:
    name: iOS build
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The certificate goes into a keychain of its own, and the profile where Xcode looks for it.
      - name: Signing certificate and profile
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in P12_BASE64 P12_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::An iOS signing secret ($name) isn't set (Settings › Secrets and variables › Actions)."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/distribution.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          # Search the new keychain first, then the ones already there.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm "$RUNNER_TEMP/distribution.p12"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done

      - run: flutter pub get
      - run: >-
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          --build-name=${{ needs.check.outputs.version }} --build-number=${{ needs.check.outputs.build }}

      - name: Name the file
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p dist
          cp build/ios/ipa/*.ipa "dist/chameleon-$VERSION.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/
          retention-days: 7

      - name: Clean up the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  publish:
    name: Publish the release
    needs: [check, android, ios]
    # Not on a dry run; and, like everything after it, only once both builds have succeeded.
    if: needs.check.outputs.release == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the version, tag it and publish the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '{android,ios}'
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes

      # On the commit that was built (main may have moved on since), so the tag covers exactly
      # what's in this release. (Pushes made here don't start this workflow again.)
      - name: Commit the version and notes, and tag it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$GITHUB_SHA"
          sed -i "s/^version: .*/version: $VERSION+$BUILD/" pubspec.yaml
          cp notes/release-notes.md "docs/release-notes/$VERSION.md"
          git add pubspec.yaml "docs/release-notes/$VERSION.md"
          git commit -m "chore(release): $VERSION" -m "Build $BUILD. [skip ci]"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Usually main is still where it was and simply moves up to it; if something was pushed in
      # the meantime, the release commit is merged in.
      - name: Bring main up to date
        run: |
          release=$(git rev-parse HEAD)
          if ! git push origin "$release:main"; then
            git fetch origin main
            git checkout -B main origin/main
            git merge --no-edit -m "chore(release): merge $VERSION into main [skip ci]" "$release"
            git push origin main
          fi

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --verify-tag \
            --title "Chameleon $VERSION" \
            --notes-file "docs/release-notes/$VERSION.md"

  testflight:
    name: Upload to TestFlight
    needs: [check, publish]
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: dist

      - name: Upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          for name in KEY_ID ISSUER_ID KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::The APP_STORE_CONNECT_$name secret isn't set (Settings › Secrets and variables › Actions)."
              exit 1
            fi
          done
          # altool looks for the key here, by its ID.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s\n' "$KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app --type ios --file dist/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

  play:
    name: Upload to Google Play
    needs: [check, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUILD: ${{ needs.check.outputs.build }}
    steps:
      - name: Is there a Play key?
        id: key
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::PLAY_SERVICE_ACCOUNT_JSON isn't set, so $VERSION wasn't uploaded to Google Play. Upload dist/chameleon-$VERSION.aab from the release by hand."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.set == 'true'
        with:
          name: android
          path: dist

      - uses: actions/download-artifact@v4
        if: steps.key.outputs.set == 'true'
        with:
          name: notes
          path: notes

      # The first fenced block under the notes' "Google Play" heading.
      - name: What's new
        if: steps.key.outputs.set == 'true'
        run: |
          mkdir -p whatsnew
          python3 - notes/release-notes.md > whatsnew/whatsnew-en-US <<'PY'
          import re, sys
          notes = open(sys.argv[1]).read()
          section = notes[notes.index("Google Play"):]
          text = re.search(r"```\n(.*?)```", section, re.S).group(1).strip()
          if len(text) > 500:
              sys.exit(f"The Google Play notes are {len(text)} characters; the limit is 500.")
          print(text)
          PY

      - uses: r0adkll/upload-google-play@v1
        if: steps.key.outputs.set == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.jumpingfox.chameleon
          releaseFiles: dist/chameleon-${{ needs.check.outputs.version }}.aab
          releaseName: ${{ needs.check.outputs.version }} (${{ needs.check.outputs.build }})
          track: alpha # closed testing; promote.yml takes it on to beta and production
          status: completed
          whatsNewDirectory: whatsnew
