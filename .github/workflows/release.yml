# Checks every push to main, and releases when the version changes.
#
# Every push: analyze and test.
# When pubspec.yaml's version has no v<version> tag yet: build the signed Android bundle (.aab, for
# Google Play) and APK (to install directly), tag the commit, and publish a GitHub release with
# docs/release-notes/<version>.md as its notes.
#
# Secrets (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its store password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One run at a time, so two quick pushes can't both release the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, to tell whether this version was released already

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Is this a new version?
        id: version
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          version=${full%%+*}
          build=${full#*+}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version (build $build) is new: releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Release ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to tag the commit and publish the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      NOTES: docs/release-notes/${{ needs.check.outputs.version }}.md
    steps:
      - uses: actions/checkout@v4

      - name: Release notes
        run: |
          if [ ! -s "$NOTES" ]; then
            echo "::error::$NOTES is missing. Write the release notes for $VERSION, then push again."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Without android/key.properties the build would quietly sign with the debug key, which
      # Google Play rejects; so stop here if a secret is missing.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The ANDROID_$name secret isn't set (Settings › Secrets and variables › Actions)."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter build appbundle --release
      - run: flutter build apk --release

      - name: Make sure they're signed with the upload key
        run: |
          for file in build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.apk; do
            if keytool -printcert -jarfile "$file" | grep -q "CN=Android Debug"; then
              echo "::error::$file is signed with the debug key, not the upload key."
              exit 1
            fi
          done

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/chameleon-$VERSION.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/chameleon-$VERSION.apk"
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Chameleon $VERSION" \
            --notes-file "$NOTES"

      - name: Clean up the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties
