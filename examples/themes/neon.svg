<svg xmlns="http://www.w3.org/2000/svg" width="828" height="112" viewBox="-1 2 828 112">
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD84D"/>
      <stop offset="1" stop-color="#FF3EA5"/>
    </linearGradient>
    <clipPath id="stripes">
      <rect x="0" y="0" width="120" height="58"/>
      <rect x="0" y="64" width="120" height="10"/>
      <rect x="0" y="82" width="120" height="10"/>
      <rect x="0" y="101" width="120" height="30"/>
    </clipPath>
  </defs>
  <text x="0" y="96" font-family="sans-serif" font-size="100" font-weight="900" font-style="italic" fill="#2DE2E6">NEON</text>
  <!-- Retro sun -->
